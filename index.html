<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Dog — режим и тренировки щенка</title>
<meta name="description" content="План выгула, питания и тренировок щенка, который считается автоматически от роста и веса.">
<meta name="theme-color" content="#3A6E46" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS: без этого мета-тега на старых версиях приложение открывается в обёртке Safari -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Smart Dog">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Шрифты грузим неблокирующе: пока CSS с чужого домена не ответил, браузер
     не выполняет ни один модуль — на медленной сети приложение стояло бы до таймаута.
     До подгрузки текст рисуется системным шрифтом из фолбэка. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Onest:wght@600;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Onest:wght@600;700&display=swap"></noscript>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
